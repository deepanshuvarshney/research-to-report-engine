name: vellum

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  DATABASE_URL: postgresql+asyncpg://vellum:vellum@postgres:5432/vellum
  REDIS_URL: redis://redis:6379/0
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  LLM_MODEL: ${LLM_MODEL:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
  MAX_SUBQUESTIONS: ${MAX_SUBQUESTIONS:-3}
  MAX_REVISION_LOOPS: ${MAX_REVISION_LOOPS:-2}
  SEARCH_RATE_LIMIT_RPS: ${SEARCH_RATE_LIMIT_RPS:-1}
  SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
  UNPAYWALL_EMAIL: ${UNPAYWALL_EMAIL:-}
  FULLTEXT_ENABLED: ${FULLTEXT_ENABLED:-true}
  FULLTEXT_MAX_PDFS: ${FULLTEXT_MAX_PDFS:-4}
  FULLTEXT_MAX_PAGES: ${FULLTEXT_MAX_PAGES:-20}
  FULLTEXT_MAX_BYTES: ${FULLTEXT_MAX_BYTES:-12000000}
  FULLTEXT_TIMEOUT_SECONDS: ${FULLTEXT_TIMEOUT_SECONDS:-25}
  DEMO_MODE: ${DEMO_MODE:-false}
  JOB_EXECUTOR: ${JOB_EXECUTOR:-arq}
  JOB_TIMEOUT_SECONDS: ${JOB_TIMEOUT_SECONDS:-600}
  WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-2}
  JOB_RATE_LIMIT_PER_MINUTE: ${JOB_RATE_LIMIT_PER_MINUTE:-6}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-vellum}
  FRONTEND_DIR: /app/frontend

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vellum
      POSTGRES_PASSWORD: vellum
      POSTGRES_DB: vellum
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vellum -d vellum"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      <<: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    command: ["arq", "research_engine.jobs.worker.WorkerSettings"]
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - embed-cache:/home/vellum/.cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  phoenix:
    profiles: ["obs"]
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"

volumes:
  pgdata:
  redisdata:
  embed-cache:
