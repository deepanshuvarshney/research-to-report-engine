[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-engine"
version = "0.1.0"
description = "Vellum: a multi-agent research-to-report engine that runs on free models and free sources."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "deepanshuvarshney" }]
keywords = ["llm", "langgraph", "rag", "research", "agents"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pgvector>=0.3.6",
  "redis>=5.2.0",
  "arq>=0.26.1",
  "httpx>=0.27.0",
  "langgraph>=0.2.50",
  "structlog>=24.4.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp-proto-http>=1.27.0",
  "markdown>=3.7",
  "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "httpx>=0.27.0",
]
embeddings = [
  "fastembed>=0.4.2",
]

[project.scripts]
vellum-eval = "research_engine.eval.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_engine = ["py.typed", "db/schema.sql", "eval/fixtures.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "B011"]

[tool.mypy]
python_version = "3.11"
packages = ["research_engine"]
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
pretty = true

[[tool.mypy.overrides]]
module = ["langgraph.*", "arq.*", "fastembed.*", "pgvector.*", "fpdf.*", "markdown.*"]
ignore_missing_imports = true
