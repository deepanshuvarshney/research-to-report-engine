# Free public demo. Render's default web plan is paid, so plan: free is required.
# The container runs Postgres, Redis, and the API together. See README "Live demo".
services:
  - type: web
    name: vellum
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/render/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: JOB_EXECUTOR
        value: inline
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: hash
      - key: FULLTEXT_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: UNPAYWALL_EMAIL
        sync: false
